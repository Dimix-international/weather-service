services:
    db:
        image: postgres:18
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: weather-service
            PGDATA: /var/lib/postgresql/data/
        ports:
            - '54321:5432'
        volumes:
            - db_weather:/var/lib/postgresql/data/

volumes:
    db_weather:
